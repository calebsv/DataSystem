<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataAluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="author" content="Gabriel Damião e Caleb Lira">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ceu: '#CBF0F8',
                        bm: '#315cfd',
                    },
                    fontFamily: {
                        out: ['Outfit', 'sans-serif'],
                        int: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="page-bg min-h-screen flex items-center justify-center p-6">
    <!--DataAluno by Gabriel Damião e Caleb Lira-->
    <main class="anim-card glow-card w-full max-w-5xl rounded-3xl border overflow-hidden flex">
        <section class="relative hidden md:block w-1/2 overflow-hidden">
            <div class="bg-gradient-to-r from-transparent to-black">
                <img src="gradient.jpg" class="anim-photo absolute inset-0 w-full h-full object-cover"
                    alt="TROCAR DEPOIS">
            </div>
        </section>

        <section class="w-full md:w-1/2 bg-white/60 backdrop-blur-md p-12">
            <div class="mx-auto max-w-sm flex flex-col items-center gap-6 text-center mb-4">
                <h1 class="anim-title text-3xl font-bold text-black font-out">Seja <span
                        class="text-bm">Bem-Vindo!</span></h1>
            </div>

            <form class="anim-form w-full flex flex-col gap-2">
                

                <div class="field">
                    <input type="email" name="email" id="email" placeholder=" " autocomplete="email"
                        class="field-input w-full rounded-lg bg-black/40 px-4 py-3 text-white font-int">
                    <label for="email" class="field-label font-int">Email</label>
                </div>

                <div class="field relative">
                    <input type="password" name="senha" id="password" placeholder=" " autocomplete="current-password"
                        class="field-input w-full rounded-lg bg-black/40 px-4 py-3 pr-12 text-white font-int">
                    <label for="password" class="field-label font-int">Senha</label>

                       <button type="button" id="togglePassword" aria-label="Mostrar senha"
    class="absolute right-2 bottom-2.5 flex h-8 w-8 items-center justify-center text-white/70 hover:text-white transition-colors">
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>

                        <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor" class="w-6 h-6 hidden">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
              

                <div class="flex justify-end">
                    <a href="recuperar.html" class="text-base font-int text-bm hover:underline font-semibold">
                        Esqueci minha senha
                    </a>
                </div>

                <div class="flex items-center justify-center pt-2">
                    <button class="btn-entrar font-bold font-int">Entrar</button>
                </div>
            </form>

            <div class="flex justify-center items-center">
                <p class="mt-6 text-center text-sm font-int text-black/70">
                    Ainda não tem uma conta?
                    <a href="cadastro.html" class="font-semibold text-bm hover:underline">Cadastre-se!</a>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
